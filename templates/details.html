<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세부 근거</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 80px;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f6f7f9; color: #1a1a1a; line-height: 1.6;
  }
  .card {
    max-width: 640px; margin: 0 auto; background: #fff;
    border: 1px solid #e3e5e8; border-radius: 12px; padding: 32px;
  }
  h1 { font-size: 18px; margin: 0 0 20px; }
  .evidence-list { margin: 0 0 20px; padding: 0; list-style: none; }
  .evidence-list li {
    font-size: 13px; color: #4a4f57; background: #f6f7f9; border: 1px solid #e3e5e8;
    border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
  }
  .profile-box {
    white-space: pre-wrap; background: #f6f7f9; border: 1px solid #e3e5e8;
    border-radius: 8px; padding: 16px; font-size: 13px; color: #1a1a1a;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  .back { display: inline-block; margin-top: 20px; color: #3b6ef6; text-decoration: none; font-size: 14px; }
  .back:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <h1>세부 근거</h1>

  {% if evidence_lines %}
  <ul class="evidence-list">
    {% for line in evidence_lines %}
    <li>{{ line }}</li>
    {% endfor %}
  </ul>
  {% endif %}

  <div class="profile-box">{{ profile_text }}</div>

  <a class="back" href="javascript:window.close()">이 창 닫기</a>
</div>
</body>
</html>
