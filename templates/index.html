<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진로 추천</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 80px;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f6f7f9; color: #1a1a1a; line-height: 1.6;
  }
  .card {
    max-width: 640px; margin: 0 auto; background: #fff;
    border: 1px solid #e3e5e8; border-radius: 12px; padding: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 24px; }

  .bubble { margin-bottom: 16px; }
  .bubble .who { font-size: 12px; color: #8a8f98; margin-bottom: 4px; }
  .bubble.ai .text { background: #f2f6ff; border-radius: 10px; padding: 10px 14px; display: inline-block; }
  .bubble.student .text { background: #f6f7f9; border-radius: 10px; padding: 10px 14px; display: inline-block; }
  #transcript { max-height: 340px; overflow-y: auto; margin-bottom: 8px; }

  textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #d5d8dc; border-radius: 8px;
    font-size: 15px; font-family: inherit; resize: vertical; min-height: 72px;
  }
  .next-btn {
    margin-top: 12px; padding: 10px 20px; border: none; border-radius: 8px;
    background: #3b6ef6; color: #fff; font-size: 15px; cursor: pointer;
  }
  .next-btn:disabled { background: #b9c3d6; cursor: not-allowed; }

  .error { color: #c0392b; margin-top: 12px; font-size: 14px; }
  .hidden { display: none; }
  .spinner { color: #8a8f98; font-size: 14px; }

  .result-label { font-weight: 700; margin-top: 8px; margin-bottom: 12px; font-size: 15px; }
  .evidence-list { margin: 0 0 16px; padding: 0; list-style: none; }
  .evidence-list li {
    font-size: 13px; color: #4a4f57; background: #f6f7f9; border: 1px solid #e3e5e8;
    border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
  }
  .profile-box {
    white-space: pre-wrap; background: #f6f7f9; border: 1px solid #e3e5e8;
    border-radius: 8px; padding: 16px; font-size: 13px; color: #1a1a1a;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  .details-link {
    display: inline-block; margin-top: 24px; font-size: 14px; color: #3b6ef6; text-decoration: none;
  }
  .details-link:hover { text-decoration: underline; }
  .details-link::after { content: " →"; }
</style>
</head>
<body>
<div class="card">
  <h1>🎓 LG에 취업하고 싶어하는 학생을 위한 진로 추천</h1>

  <div id="transcript"></div>
  <div id="qa-flow"></div>
  <div id="error" class="error hidden"></div>

  <div id="result" class="hidden">
    <div class="result-label">[핵심 요약]</div>
    <ul id="evidence-list" class="evidence-list hidden"></ul>
    <div id="profile-text" class="profile-box"></div>
    <a id="details-link" class="details-link hidden" target="_blank" rel="noopener">세부내용 확인</a>
  </div>
</div>

<script>
const INTRO_PROMPT = {{ intro_prompt | tojson }};

const transcriptBox = document.getElementById("transcript");
const flow = document.getElementById("qa-flow");
const errorBox = document.getElementById("error");

let interviewId = null;

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.remove("hidden");
}
function clearError() { errorBox.classList.add("hidden"); }

function addBubble(who, text) {
  const wrap = document.createElement("div");
  wrap.className = `bubble ${who}`;
  const label = who === "ai" ? "AI" : "나";
  wrap.innerHTML = `<div class="who">${label}</div><div class="text"></div>`;
  wrap.querySelector(".text").textContent = text;
  transcriptBox.appendChild(wrap);
  transcriptBox.scrollTop = transcriptBox.scrollHeight;
}

function renderQuestion(question) {
  clearError();
  addBubble("ai", question);
  flow.innerHTML = "";

  const ta = document.createElement("textarea");
  ta.placeholder = "여기에 답을 적어 주세요";
  flow.appendChild(ta);

  const btn = document.createElement("button");
  btn.className = "next-btn";
  btn.textContent = "답하기";
  btn.disabled = true;
  ta.addEventListener("input", () => { btn.disabled = ta.value.trim() === ""; });
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !btn.disabled) { e.preventDefault(); btn.click(); }
  });
  btn.onclick = () => submitAnswer(ta.value.trim());
  flow.appendChild(btn);
  ta.focus();
}

async function submitAnswer(answer) {
  addBubble("student", answer);
  flow.innerHTML = `<div class="spinner">생각하는 중…</div>`;
  clearError();

  let res;
  try {
    res = await fetch("/api/interview/answer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ interview_id: interviewId, answer }),
    });
  } catch (e) {
    flow.innerHTML = "";
    showError("서버에 연결할 수 없습니다.");
    return;
  }

  const data = await res.json();
  if (!res.ok) {
    flow.innerHTML = "";
    showError(data.error || "요청을 처리하지 못했습니다.");
    return;
  }

  interviewId = data.interview_id;

  if (data.status === "question") {
    renderQuestion(data.question);
    return;
  }

  if (data.status === "empty") {
    flow.innerHTML = "";
    showError("입력하신 내용으로는 IT 역량이 검출되지 않았습니다. 새로고침해서 다시 답해 보시겠어요?");
    return;
  }

  // status === "done" — [핵심 요약]은 바로 보여주고, [진로 추천]은 링크를 눌러야 나온다
  flow.innerHTML = "";
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("profile-text").textContent = data.profile_text;

  const evidenceList = document.getElementById("evidence-list");
  if (data.evidence_lines && data.evidence_lines.length) {
    evidenceList.innerHTML = "";
    data.evidence_lines.forEach((line) => {
      const li = document.createElement("li");
      li.textContent = line;
      evidenceList.appendChild(li);
    });
    evidenceList.classList.remove("hidden");
  }

  const link = document.getElementById("details-link");
  link.href = `/details/${data.result_id}`;
  link.classList.remove("hidden");
}

renderQuestion(INTRO_PROMPT);
</script>
</body>
</html>
